<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Linux Study — Progress Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #1e1e1e; --panel: #252526; --panel2: #2d2d30; --border: #3e3e42;
    --fg: #d4d4d4; --muted: #858585; --accent: #4ec9b0; --accent2: #569cd6;
    --err: #f48771;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; }
  header { padding: 14px 24px; background: var(--panel2); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 18px; margin: 0; color: var(--accent); }
  header a { color: var(--accent2); text-decoration: none; font-size: 13px; }
  header a:hover { text-decoration: underline; }
  .container { max-width: 1280px; margin: 0 auto; padding: 24px; }
  .overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px; margin-bottom: 28px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 14px 16px; }
  .stat-label { color: var(--muted); font-size: 11.5px; text-transform: uppercase;
    letter-spacing: 0.5px; }
  .stat-value { color: var(--accent); font-size: 26px; font-weight: 600; margin-top: 4px; }
  .stat-value.blue { color: var(--accent2); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
  .row.full { grid-template-columns: 1fr; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 18px; }
  .card h2 { margin: 0 0 14px 0; color: var(--accent2); font-size: 13px;
    text-transform: uppercase; letter-spacing: 0.5px; }
  .chart-wrap { position: relative; height: 240px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.5px; font-weight: 600; }
  td.num, th.num { text-align: right; font-family: "SF Mono", Menlo, monospace; }
  .empty { color: var(--muted); padding: 24px; text-align: center; font-size: 13px; }
  tr:hover { background: var(--panel2); }
  .lesson-path { color: var(--muted); font-family: "SF Mono", Menlo, monospace; font-size: 11.5px; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px;
    font-weight: 600; }
  .badge-pass { background: #1a3a1a; color: var(--accent); border: 1px solid var(--accent); }
  .badge-fail { background: #3a1a1a; color: var(--err); border: 1px solid var(--err); }
  .progress-bar-bg { background: var(--border); border-radius: 3px; height: 6px; margin-top: 6px; }
  .progress-bar-fill { height: 100%; border-radius: 3px; background: var(--accent);
    transition: width 0.5s ease; }
</style>
</head>
<body>
<header>
  <h1>Linux Study — Progress Dashboard</h1>
  <a href="/linux">← Back to lessons</a>
</header>
<div class="container">
  <div class="overview" id="overview">
    <div class="stat"><div class="stat-label">Lessons Opened</div><div class="stat-value" id="stat-opens">—</div></div>
    <div class="stat"><div class="stat-label">Exercises Passed</div><div class="stat-value" id="stat-passed">—</div></div>
    <div class="stat"><div class="stat-label">Checks Run</div><div class="stat-value blue" id="stat-checks">—</div></div>
    <div class="stat"><div class="stat-label">Time Spent</div><div class="stat-value blue" id="stat-time">—</div></div>
    <div class="stat"><div class="stat-label">Sessions</div><div class="stat-value" id="stat-sessions">—</div></div>
  </div>

  <div class="row">
    <div class="card">
      <h2>Weekly Exercises Passed</h2>
      <div class="chart-wrap"><canvas id="weeklyChart"></canvas></div>
    </div>
    <div class="card">
      <h2>Time by Block</h2>
      <div class="chart-wrap"><canvas id="blockChart"></canvas></div>
    </div>
  </div>

  <div class="row">
    <div class="card">
      <h2>Block Progress</h2>
      <div id="block-progress"></div>
    </div>
    <div class="card">
      <h2>Most-Studied Lessons</h2>
      <div id="lessons-table"></div>
    </div>
  </div>
</div>

<script>
const CHART_COLORS = {
  accent: '#4ec9b0', accent2: '#569cd6', muted: '#858585',
  border: '#3e3e42', panel2: '#2d2d30',
};

Chart.defaults.color = '#858585';
Chart.defaults.borderColor = '#3e3e42';

async function load() {
  const res = await fetch('/api/linux/stats');
  if (!res.ok) { document.body.innerHTML += '<p style="color:red;padding:20px">Failed to load stats</p>'; return; }
  const data = await res.json();
  renderOverview(data.overall || {});
  renderWeeklyChart(data.weekly || []);
  renderBlockChart(data.sections || []);
  renderBlockProgress(data.sections || []);
  renderLessonsTable(data.lessons || []);
}

function fmtTime(seconds) {
  if (!seconds) return '0m';
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

function renderOverview(o) {
  document.getElementById('stat-opens').textContent   = o.opens ?? 0;
  document.getElementById('stat-passed').textContent  = o.exercises_done ?? 0;
  document.getElementById('stat-checks').textContent  = o.checks_run ?? 0;
  document.getElementById('stat-time').textContent    = fmtTime(o.total_seconds);
  document.getElementById('stat-sessions').textContent = o.sessions ?? 0;
}

function renderWeeklyChart(weekly) {
  if (!weekly.length) return;
  const sorted = [...weekly].reverse();
  new Chart(document.getElementById('weeklyChart'), {
    type: 'bar',
    data: {
      labels: sorted.map(w => w.week),
      datasets: [{
        label: 'Exercises Passed',
        data: sorted.map(w => w.lessons),
        backgroundColor: CHART_COLORS.accent + 'cc',
        borderColor: CHART_COLORS.accent,
        borderWidth: 1,
        borderRadius: 3,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
    }
  });
}

function blockLabel(section) {
  return section.replace(/^linux\//, '').replace(/block\d+_/, '').replace(/_/g, ' ');
}

function renderBlockChart(sections) {
  const linux = sections.filter(s => s.section && s.section.startsWith('linux/'));
  if (!linux.length) return;
  new Chart(document.getElementById('blockChart'), {
    type: 'bar',
    data: {
      labels: linux.map(s => blockLabel(s.section)),
      datasets: [{
        label: 'Minutes',
        data: linux.map(s => Math.round((s.total_seconds || 0) / 60)),
        backgroundColor: CHART_COLORS.accent2 + 'cc',
        borderColor: CHART_COLORS.accent2,
        borderWidth: 1,
        borderRadius: 3,
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { beginAtZero: true } }
    }
  });
}

function renderBlockProgress(sections) {
  const el = document.getElementById('block-progress');
  const linux = sections.filter(s => s.section && s.section.startsWith('linux/'));
  if (!linux.length) { el.innerHTML = '<div class="empty">No data yet — open some lessons to see progress.</div>'; return; }
  const maxTime = Math.max(...linux.map(s => s.total_seconds || 0), 1);
  el.innerHTML = linux.map(s => {
    const pct = Math.round(((s.total_seconds || 0) / maxTime) * 100);
    const label = blockLabel(s.section);
    const time = fmtTime(s.total_seconds || 0);
    return `<div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
        <span style="color:var(--fg)">${label}</span>
        <span style="color:var(--muted)">${time} · ${s.opens || 0} opens</span>
      </div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

function renderLessonsTable(lessons) {
  const el = document.getElementById('lessons-table');
  const linux = lessons
    .filter(l => l.lesson_path && l.lesson_path.startsWith('linux/'))
    .sort((a, b) => (b.total_seconds || 0) - (a.total_seconds || 0))
    .slice(0, 20);
  if (!linux.length) { el.innerHTML = '<div class="empty">No lessons studied yet.</div>'; return; }
  el.innerHTML = `<table>
    <thead><tr>
      <th>Lesson</th>
      <th class="num">Opens</th>
      <th class="num">Time</th>
      <th class="num">Checks</th>
    </tr></thead>
    <tbody>
    ${linux.map(l => {
      const name = l.lesson_path.replace(/^linux\/[^/]+\//, '').replace(/\.md$/, '').replace(/^\d+_/, '').replace(/_/g, ' ');
      const block = l.lesson_path.replace(/^linux\//, '').split('/')[0].replace(/block\d+_/, '');
      return `<tr>
        <td><div>${name}</div><div class="lesson-path">${block}</div></td>
        <td class="num">${l.opens || 0}</td>
        <td class="num">${fmtTime(l.total_seconds)}</td>
        <td class="num">${l.checks_run || 0}</td>
      </tr>`;
    }).join('')}
    </tbody>
  </table>`;
}

load();
</script>
</body>
</html>
